<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز التنبؤ بالتطور المداري — بحر العرب وخليج عدن</title>
<style>
  :root {
    --bg:#0d1420; --panel:#152030; --panel2:#1c2a3d; --line:#2a3b52;
    --txt:#e8eef7; --mut:#9db0c7; --acc:#29b6f6; --acc2:#ffb300;
    --red:#e53935; --orange:#ff9800; --blue:#1e88e5; --green:#43a047;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:var(--bg);
    color:var(--txt); min-height:100vh; line-height:1.6;
  }
  header {
    background:linear-gradient(135deg,#0f2038,#142a47);
    padding:22px 28px; border-bottom:2px solid var(--acc);
    text-align:center;
  }
  header h1 { font-size:1.7rem; color:#fff; letter-spacing:0.5px; }
  header p { color:var(--mut); margin-top:6px; font-size:0.95rem; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px; }
  .tabs { display:flex; gap:10px; margin:20px 0 4px; }
  .tab-btn {
    flex:1; padding:14px 10px; border:none; cursor:pointer; font-size:1.05rem;
    font-weight:bold; border-radius:10px; color:#fff; transition:.2s;
    background:var(--panel2); border:1px solid var(--line);
  }
  .tab-btn.active { background:linear-gradient(135deg,#0a5a8a,#0d7bb5); border-color:var(--acc); }
  .tab-btn:hover { filter:brightness(1.15); }
  .panel { display:none; }
  .panel.show { display:block; animation:fade .3s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .nav-row { display:flex; align-items:center; gap:8px; margin:16px 0 10px; flex-wrap:wrap; }
  .nav-btn {
    padding:9px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--txt); cursor:pointer; font-size:0.95rem; font-weight:bold;
  }
  .nav-btn:hover { background:var(--acc); color:#04121f; }
  .nav-btn.active { background:var(--acc); color:#04121f; border-color:var(--acc); }
  .day-grid { display:flex; gap:6px; flex-wrap:wrap; }
  .day-grid .nav-btn { flex:0 0 auto; min-width:62px; text-align:center; }
  .play-btn { background:#3c2163; }
  .play-btn:hover { background:var(--acc2); color:#201500; }
  .main-card {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-top:10px;
  }
  .main-card img { width:100%; height:auto; border-radius:8px; display:block; }
  .info-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
  .info {
    flex:1; min-width:150px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px;
  }
  .info .k { color:var(--mut); font-size:0.82rem; margin-bottom:4px; }
  .info .v { font-size:1.35rem; font-weight:bold; color:#fff; }
  .badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:0.9rem; font-weight:bold; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:760px) { .charts { grid-template-columns:1fr; } }
  .chart-card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .chart-card img { width:100%; border-radius:8px; }
  .chart-card h3 { font-size:1rem; color:var(--acc2); margin-bottom:8px; }
  .note {
    margin-top:18px; background:#1a1408; border:1px solid #5a4a20; border-radius:12px;
    padding:14px 16px; color:#e8d9a8; font-size:0.9rem;
  }
  footer { text-align:center; color:var(--mut); font-size:0.8rem; padding:22px; }
</style>
<meta http-equiv="refresh" content="21600">
</head>
<body>
<header>
  <h1>مركز التنبؤ بالتطور المداري — بحر العرب وخليج عدن</h1>
  <p>مؤشر التطور المداري التراكمي المقترن (EURO-GPI) — من نماذج GFS v17 و CFSv2</p>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" id="t-short" onclick="switchTab('short')">التوقعات قصيرة المدى<br><small>(GFS — 16 يوماً)</small></button>
    <button class="tab-btn" id="t-long" onclick="switchTab('long')">التوقعات بعيدة المدى<br><small>(CFSv2 — شهري)</small></button>
  </div>

  <!-- ===== قصير المدى ===== -->
  <div class="panel show" id="p-short">
    <div class="nav-row">
      <button class="nav-btn" onclick="stepShort(-1)">‹ السابق</button>
      <div class="day-grid" id="day-btns"></div>
      <button class="nav-btn" onclick="stepShort(1)">التالي ›</button>
      <button class="nav-btn play-btn" id="play-btn" onclick="togglePlay()">▶ تشغيل</button>
    </div>
    <div class="main-card">
      <img id="short-img" alt="خريطة التوقع">
    </div>
    <div class="info-row" id="short-info"></div>
    <div class="charts">
      <div class="chart-card"><h3 id="short-ts-title"></h3><img id="short-ts-img" alt="سلسلة زمنية"></div>
      <div class="chart-card"><h3 id="monsoon-title"></h3><img id="monsoon-img" alt="انحسار الرياح الموسمية"></div>
    </div>
  </div>

  <!-- ===== بعيد المدى ===== -->
  <div class="panel" id="p-long">
    <div class="nav-row" id="month-btns"></div>
    <div class="main-card">
      <img id="long-img" alt="خريطة التوقع الشهري">
    </div>
    <div class="info-row" id="long-info"></div>
    <div class="charts">
      <div class="chart-card"><h3 id="sst-title"></h3><img id="sst-img" alt="SST"></div>
      <div class="chart-card"><h3 id="monsoon-title2"></h3><img id="monsoon-img2" alt="انحسار الرياح الموسمية"></div>
    </div>
  </div>

  <div class="note" id="method-note"></div>
</div>

<footer>أُنشئ اعتماداً على بيانات NOAA NOMADS (GFS v17) و CFSv2 — تحليل 2026-09-10 00 | أداة استرشادية للتنبؤ بالبيئات المواتية، ليست إنذاراً رسمياً</footer>

  document.getElementById('short-info').innerHTML = `
    <div class="info"><div class="k">التاريخ</div><div class="v">${s.date} (${s.label})</div></div>
    <div class="info"><div class="k">أقصى مؤشر</div><div class="v" style="color:${s.catc}">${s.value}</div></div>
    <div class="info"><div class="k">موقع الذروة</div><div class="v">${s.lat}°N، ${s.lon}°E</div></div>
    <div class="info"><div class="k">حالة البيئة</div><div class="v"><span class="badge" style="background:${s.catc};color:#fff">${s.cat}</span></div></div>
    <div class="info"><div class="k">قص موسمي (حوض)</div><div class="v">${s.shear} م/ث</div></div>`;
  document.querySelectorAll('#day-btns .nav-btn').forEach((b,i)=>b.classList.toggle('active', i===si));
}

function renderLong() {
  const s = long[li];
  document.getElementById('long-img').src = 'data:image/png;base64,' + s.img;
  document.getElementById('long-info').innerHTML = `
    <div class="info"><div class="k">الشهر</div><div class="v">${s.name}</div></div>
    <div class="info"><div class="k">أقصى مؤشر (0–100)</div><div class="v" style="color:${s.value>=50?'#ffb300':'#29b6f6'}">${s.value}</div></div>
    <div class="info"><div class="k">موقع الذروة</div><div class="v">${s.lat}°N، ${s.lon}°E</div></div>
    <div class="info"><div class="k">قص زوالي (حوض)</div><div class="v">${s.shear} م/ث</div></div>
    <div class="info"><div class="k">متوسط SST</div><div class="v">${s.sst}°C</div></div>
    <div class="info"><div class="k">وزن المناخ</div><div class="v">${s.scf}</div></div>`;
  document.querySelectorAll('#month-btns .nav-btn').forEach((b,i)=>b.classList.toggle('active', i===li));
}

function stepShort(d) { si = Math.max(0, Math.min(short.length-1, si+d)); renderShort(); }
function stepLong(d) { li = Math.max(0, Math.min(long.length-1, li+d)); renderLong(); }

function togglePlay() {
  if (playTimer) { stopPlay(); return; }
  document.getElementById('play-btn').textContent = '⏸ إيقاف';
  playTimer = setInterval(()=>{ si = (si+1)%short.length; renderShort(); }, 900);
}
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer=null; }
  document.getElementById('play-btn').textContent = '▶ تشغيل';
}

// بناء أزرار الأيام والأشهر
const dayGrid = document.getElementById('day-btns');
short.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className = 'nav-btn'; b.textContent = s.label;
  b.onclick = ()=>{ si=i; renderShort(); };
  dayGrid.appendChild(b);
});
const monthRow = document.getElementById('month-btns');
long.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className = 'nav-btn'; b.textContent = s.name;
  b.onclick = ()=>{ li=i; renderLong(); };
  monthRow.appendChild(b);
});

// صور الرسوم البيانية الثابتة
document.getElementById('short-ts-img').src = 'data:image/png;base64,' + DATA.short_ts;
document.getElementById('monsoon-img').src = 'data:image/png;base64,' + DATA.monsoon;
document.getElementById('monsoon-img2').src = 'data:image/png;base64,' + DATA.monsoon;
document.getElementById('sst-img').src = 'data:image/png;base64,' + DATA.sst;

// العناوين العربية للرسوم
document.getElementById('short-ts-title').textContent = 'تطور المؤشر قصير المدى';
document.getElementById('monsoon-title').textContent = 'انحسار الرياح الموسمية (مفتاح نافذة أكتوبر-نوفمبر)';
document.getElementById('monsoon-title2').textContent = 'انحسار الرياح الموسمية';
document.getElementById('sst-title').textContent = 'حرارة سطح البحر الشهرية';
document.getElementById('method-note').innerHTML =
  '<strong>ملاحظة منهجية:</strong> النموذج يدمج العوامل الأوروبية (GPP + DGPI + ENGPI) مع تصحيحين: ' +
  '<b>هندسي</b> (إسقاط الإشارة الزائفة في البحر الأحمر وخليج عدن حيث لا يحدث تكوّن تاريخياً) و<b>موسمي</b> ' +
  '(كبت شهر سبتمبر بسبب الرياح الموسمية النشطة). العتبات: 5 = انتقالي، 20 = نشاط محتمل. ' +
  'التوقعات البعيدة المدى (CFSv2) مناخية بدقة 1° وهي استرشادية وليست إنذاراً لأعاصير محددة.';

renderShort(); renderLong();
</script>
