name: Update live weather API

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest weather and marine data
        run: bash scripts/update_live_data.sh

      - name: Commit updated API response
        run: |
          git config user.name "scorpio-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "auto-update live weather data"
            git push
          fi
